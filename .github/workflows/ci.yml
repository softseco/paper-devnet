name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
      - name: Build
        run: |
          anchor build --no-idl -- --tools-version v1.57
          # anchor.workspace reads target/idl, and --tools-version is not valid in the IDL step
          anchor idl build -o target/idl/paper.json -t target/types/paper.ts
      - name: Test
        run: |
          npm ci || npm install
          anchor test --skip-build --provider.cluster localnet
